# fly.toml app configuration file generated for fractal-wk1-survey-app on 2025-02-08T12:38:47-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fractal-wk1-survey-app'
primary_region = 'ewr'

[build]

[deploy]
  release_command = 'bunx prisma migrate deploy'
  seed_command = 'ts-node prisma/seed.ts'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
